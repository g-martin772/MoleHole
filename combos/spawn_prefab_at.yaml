Name: Spawn Prefab At
Description: Spawns an entity from a preset or an existing entity name at a position when its flow input fires.
Keywords: [spawn, create, prefab, instantiate, place]
Wrap: false
Fields:
  - Label: Prefab
    Type: String
    Default: Sphere
    Targets: [{Node: prefab, Set: Constant}]
  - Label: Position
    Type: Vec3
    Default: [0, 0, 0]
    Targets: [{Node: where, Set: Constant}]
  - Label: Name
    Type: String
    Default: ""
    Targets: [{Node: label, Set: Constant}]
Entry: spawn
Nodes:
  - {Key: spawn, Kind: Spawn Entity, Pos: [260, 0]}
  - {Key: prefab, Kind: String Constant, Constant: Sphere, Pos: [0, 0]}
  - {Key: where, Kind: Vec3 Constant, Constant: [0, 0, 0], Pos: [0, 80]}
  - {Key: label, Kind: String Constant, Constant: "", Pos: [0, 160]}
Links:
  - [prefab.Value, spawn.Preset]
  - [where.Value, spawn.Position]
  - [label.Value, spawn.Name]
