Name: Orbit Camera Around
Description: Circles a camera around a target entity at a fixed radius and angular speed, always looking at it.
Keywords: [orbit, camera, circle, rotate, spin, around]
Variables:
  - {Name: Angle, Type: Float, Default: 0}
Fields:
  - Label: Camera
    Type: Object
    Targets: [{Node: camera, Set: Target}]
  - Label: Target
    Type: Object
    Targets: [{Node: target, Set: Target}]
  - Label: Radius
    Type: Float
    Default: 10
    Targets: [{Node: radius, Set: Constant}]
  - Label: Speed
    Type: Float
    Default: 0.5
    Targets: [{Node: speed, Set: Constant}]
