Name: Fade Property
Description: Smoothly changes a numeric property of an entity from one value to another over time. Starts when play begins.
Keywords: [fade, animate, tween, property, lerp, interpolate]
Variables:
  - {Name: Elapsed, Type: Float, Default: 0}
Fields:
  - Label: Entity
    Type: Object
    Targets: [{Node: entity, Set: Target}]
  - Label: Property
    Type: Choice
    Options:
      - {Label: Black Hole Mass, Vars: {Comp: BlackHole, Prop: Mass}}
      - {Label: Black Hole Spin, Vars: {Comp: BlackHole, Prop: Spin}}
      - {Label: Black Hole Charge, Vars: {Comp: BlackHole, Prop: Charge}}
      - {Label: Sphere Radius, Vars: {Comp: Sphere, Prop: Radius}}
      - {Label: Sphere Spin, Vars: {Comp: Sphere, Prop: Spin}}
  - Label: From
    Type: Float
    Default: 0
    Targets: [{Node: from, Set: Constant}]
  - Label: To
    Type: Float
    Default: 1
    Targets: [{Node: to, Set: Constant}]
  - Label: Duration
    Type: Float
    Default: 2
    Targets: [{Node: duration, Set: Constant}]
Nodes:
  - {Key: tick, Kind: Tick, Pos: [0, 0]}
  - {Key: getElapsed, Kind: "Get Variable (Float)", Variable: Elapsed, Pos: [0, 140]}
  - {Key: advance, Kind: Add, Pos: [240, 80]}
  - {Key: zero, Kind: Float Constant, Constant: 0, Pos: [240, 220]}
  - {Key: duration, Kind: Float Constant, Constant: 2, Pos: [240, 300]}
  - {Key: epsilon, Kind: Float Constant, Constant: 0.0001, Pos: [240, 380]}
  - {Key: safeDuration, Kind: Max, Pos: [480, 320]}
  - {Key: clamped, Kind: Clamp, Pos: [720, 120]}
  - {Key: setElapsed, Kind: "Set Variable (Float)", Variable: Elapsed, Pos: [960, 0]}
  - {Key: progress, Kind: Divide, Pos: [960, 160]}
  - {Key: from, Kind: Float Constant, Constant: 0, Pos: [960, 300]}
  - {Key: to, Kind: Float Constant, Constant: 1, Pos: [960, 380]}
  - {Key: blend, Kind: Lerp, Pos: [1200, 240]}
  - {Key: entity, Kind: "Get ${Comp}", Pos: [1200, 80]}
  - {Key: write, Kind: "Set ${Comp}", Pos: [1440, 0]}
Links:
  - [tick.Out, setElapsed.In]
  - [getElapsed.#0, advance.A]
  - [tick.DeltaTime, advance.B]
  - [duration.Value, safeDuration.A]
  - [epsilon.Value, safeDuration.B]
  - [advance.Result, clamped.Value]
  - [zero.Value, clamped.Min]
  - [safeDuration.Result, clamped.Max]
  - [clamped.Result, setElapsed.#1]
  - [clamped.Result, progress.A]
  - [safeDuration.Result, progress.B]
  - [from.Value, blend.A]
  - [to.Value, blend.B]
  - [progress.Result, blend.T]
  - [setElapsed.Out, write.In]
  - [entity.Entity, write.Entity]
  - ["blend.Result", "write.${Prop}"]
