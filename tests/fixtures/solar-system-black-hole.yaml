Render:
  Version: 1
  Contexts:
    Edit: Black hole system
    Play: Black hole system
    Reference: Reference
    Export: Black hole system (clean)
  Profiles:
    - Name: Black hole system
      Description: "Straight rays, the hole drawn as its analytic shadow, photon ring and disk, the hole's point light, automatic exposure so every planet shows from Mercury to Neptune, orbit lines and markers on."
      Base: Flat
      Set:
        post.tonemap: Aces
        post.exposure_mode: Auto
        post.exposure_key: 0.09
        post.bloom: true
        post.bloom_intensity: 1.5
        post.lens_flare: false
        overlay.body_orbits: true
    - Name: Black hole system (clean)
      Description: "Straight rays, the hole drawn as its analytic shadow, photon ring and disk, the hole's point light, automatic exposure so every planet shows from Mercury to Neptune, no overlays."
      Base: Flat
      Set:
        post.tonemap: Aces
        post.exposure_mode: Auto
        post.exposure_key: 0.09
        post.bloom: true
        post.bloom_intensity: 1.5
        post.lens_flare: false
    - Name: Black hole close-up
      Description: "Geodesic integration around the hole with the planets hidden: with them in the scene the lensing kernels take seconds per frame (every ray is tested against all 62 spheres). Use it with the Black hole camera."
      Base: Traced
      Set:
        objects.spheres: false
        post.tonemap: Aces
        post.exposure_mode: Auto
        post.exposure_key: 0.09
        post.bloom: true
        post.lens_flare: false
    - Name: Black hole system (sunny 16)
      Description: "A physical camera at f/16, 1/100 s, ISO 100: sunlit scenes at 1 AU and the Sun's disc are exposed right, the outer planets fall dark as they do to a real camera."
      Base: Flat
      Set:
        post.tonemap: Aces
        post.exposure_mode: Physical
        post.camera_aperture: 16
        post.camera_shutter: 0.01
        post.camera_iso: 100
        post.bloom: true
        post.bloom_intensity: 1.5
        post.lens_flare: false
