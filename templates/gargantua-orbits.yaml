Scene: Gargantua orbits (geodesic bodies)
SchemaVersion: 2
# One second of runner time is 6000 s of coordinate time; Gargantua's GM/c³ is about 490 s.
# The camera rides a geodesic orbit; the animation graph "Camera looks at Gargantua" turns it towards the hole
# every tick (Tick -> Look At(camera position, hole position) -> Transform.Rotation).
