      Description: Geodesic integration at reference tolerance with the volumetric disk. For final renders.
      Base: Reference
      Set:
        spacetime.solution: KerrNewman
        transport.step_size: 0.0613
        transport.max_steps: 61882
        transport.adaptive_rate: 0.84
        disk.height: 0.163
        disk.speed: 0.391
        disk.noise_scale: 0.847
        disk.noise_lod: 6.212
        disk.accretion_rate: 0.1785
        disk.opacity: 0.25
        disk.display_temperature: 5399
        disk.hot_spots: 4
        camera.observer: Raindrop
        sampling.resolution_scale: 79
        post.tonemap: Aces
        post.exposure: -0.5
        post.bloom_threshold: 0.656
        post.bloom_passes: 6
        post.bloom_intensity: 3.272
        overlay.tidal_axes: true
        overlay.tidal_axes_scale: 2
    - Name: Flat (edited)
      Description: Straight rays, analytic shadow and disk, no lensing, no bloom. Fast, for editing and placing objects.
      Base: Flat
      Set:
        post.tonemap: Aces
        post.exposure: -2.2
        overlay.tidal_axes: true