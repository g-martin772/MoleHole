Render:
  Version: 1
  Contexts:
    Edit: Solar system
    Play: Solar system
    Reference: Reference
    Export: Solar system (clean)
  Profiles:
    - Name: Solar system
      Description: Straight rays (no black hole), the Sun as the point light, automatic exposure so every planet shows from Mercury to Neptune, orbit lines and markers on.
      Base: Flat
      Set:
        post.tonemap: Aces
        post.exposure: 1.7
        post.exposure_key: 0.09
        post.bloom: true
        post.bloom_intensity: 1.5
        overlay.body_orbits: true
    - Name: Solar system (clean)
      Description: Straight rays (no black hole), the Sun as the point light, automatic exposure so every planet shows from Mercury to Neptune, no overlays.
      Base: Flat
      Set:
        post.tonemap: Aces
        post.exposure_mode: Auto
        post.exposure_key: 0.09
        post.bloom: true
        post.bloom_intensity: 1.5
    - Name: Solar system (outer planets)
      Description: "Fixed exposure +3 EV for Jupiter and beyond: they get 4 % (Jupiter) to 0.1 % (Neptune) of the light Earth does, and automatic exposure would lift the starry sky with them."
      Base: Flat
      Set:
        post.tonemap: Aces
        post.exposure: 3
        post.bloom: true
        post.bloom_intensity: 1.5
    - Name: Solar system (sunny 16)
      Description: "A physical camera at f/16, 1/100 s, ISO 100: sunlit scenes at 1 AU and the Sun's disc are exposed right, the outer planets fall dark as they do to a real camera."
      Base: Flat
      Set:
        post.tonemap: Aces
        post.exposure_mode: Physical
        post.camera_aperture: 16
        post.camera_shutter: 0.01
        post.bloom: true
        post.bloom_intensity: 1.5