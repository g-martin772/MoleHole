# Miller's planet in front of Gargantua, composed like the film rather than placed like the physics: the hole, camera
# and colour of gargantua-film.yaml (a/M = 0.6 as in the film's images, Doppler and redshift colour off) with Miller's
# planet (maps from tools/gen_planet_textures.py) as a static foreground body about 8e7 m from the camera, lit by what
# its sky probe sees of the disk behind it and by a key light from behind the camera, as the film lit it for the shot. On its real orbit, r - M = 4e-5 M of a near-extremal hole, the planet sits
# inside the disk plane and the whole sky is disk (interstellar-bodies.yaml, docs/notes/interstellar_planets.md).
# Export with --scene-camera.
