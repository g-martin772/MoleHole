Scene: M1 orbits (Kerr, a = 0.9)
SchemaVersion: 2
# Milestone M1 acceptance scene (docs/notes/orbit_overlays_and_nodes.md): bodies on exact Kerr geodesics around a
# 10^6 solar-mass hole with a/M = 0.9. GM/c^3 is about 4.9 s; TimeScale 100 makes one 10 M orbit take about 10 s.
#  - Prograde and Retrograde circular orbits at the same r = 10 M: frame dragging gives them different periods
#    (prograde Omega = 1/(r^1.5 + a), retrograde 1/(r^1.5 - a) in units of 1/M; the retrograde ISCO is 8.72 M).
#  - Eccentric, inclined orbit between about 6.3 M and 14 M: periapsis precession and nodal (Lense-Thirring) precession.
#  - Raindrop: falls in from rest at infinity.
#  - The scene camera rides its own inclined orbit; the animation graph turns it towards the hole every tick.
# The "M1 Orbits" render profile shows the characteristic radii and predicted orbits.
